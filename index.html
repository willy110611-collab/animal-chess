<style>
/* 版面：上方 3D 戰場（含 HUD、羈絆欄），下方操作區（等級金幣、裝備、5 格商店、隊友與準備） */
:root {

  --dock: #3b2a24; --dock-2: #4a362e;

  --f-body: "Zen Maru Gothic", "Huninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }

/* ---------- 大廳 ---------- */

#lobby h1 { font-family: var(--f-display); font-size: clamp(44px, 12vw, 64px); margin: 0; color: var(--paper); letter-spacing: .06em; text-shadow: 0 4px 0 rgba(120,50,25,.5); }
#lobby .sub { color: #fff3dc; margin: 0; font-size: 15px; max-width: 30ch; line-height: 1.6; }
.parade { display: flex; justify-content: center; align-items: flex-end; min-height: 120px; }
.parade img { width: 92px; height: 92px; margin: 0 -10px; animation: bob 2.4s ease-in-out infinite; }

.nightsky { position: absolute; inset: 0; opacity: var(--night, 0); background: radial-gradient(1.5px 1.5px at 12% 12%, #fff 98%, transparent), radial-gradient(1.5px 1.5px at 28% 22%, #fff 98%, transparent), radial-gradient(2px 2px at 46% 8%, #fff 98%, transparent), radial-gradient(1.5px 1.5px at 64% 18%, #fff 98%, transparent), radial-gradient(2px 2px at 82% 10%, #fff 98%, transparent), radial-gradient(1.5px 1.5px at 90% 26%, #fff 98%, transparent), linear-gradient(#1d2a4a, rgba(29,42,74,.55) 40%, rgba(29,42,74,.25)); }

.num.magic { color: #c9b6ff; } .num.true { color: #ffffff; } .num.crit { color: #ffcf3a; font-size: 22px; } .num.heal { color: #9be07a; } .num.miss { color: #d8cfc6; font-size: 13px; } .num.cc { color: #ffb36b; font-size: 13px; } .num.skill { color: #fff6c8; font-size: 15px; -webkit-text-stroke: 3px #7a2e1e; }

.team { background: rgba(43,28,22,.78); border-radius: 12px; padding: 6px 8px; color: var(--paper); font-size: 11px; font-weight: 700; display: grid; gap: 3px; backdrop-filter: blur(3px); }

.team.stand .srow.me { color: #9be07a; opacity: 1; } .team.stand .srow.opp { color: #ffb08a; opacity: 1; } .team.stand .srow.out { opacity: .4; text-decoration: line-through; }

#traits { position: absolute; left: max(6px, env(safe-area-inset-left, 0px)); top: 92px; display: grid; gap: 4px; pointer-events: auto; max-height: calc(100% - 110px); overflow-y: auto; scrollbar-width: none; }
.tr { display: grid; grid-template-columns: 26px auto; align-items: center; gap: 4px; background: rgba(43,28,22,.72); color: var(--paper); border-radius: 8px; padding: 3px 7px 3px 3px; font-size: 11px; text-align: left; }

.tr.combo { background: rgba(168,68,44,.88); }
.tr.combo.off { background: rgba(43,28,22,.6); opacity: .8; }

#banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.6); pointer-events: none; opacity: 0; text-align: center; white-space: nowrap; }
#banner.show { animation: ban 1.6s cubic-bezier(.2,.9,.3,1.2) forwards; }
#banner .b1 { font-family: var(--f-display); font-size: clamp(30px, 8vw, 46px); color: #fff6e0; -webkit-text-stroke: 6px rgba(70,30,15,.85); paint-order: stroke fill; letter-spacing: .04em; }

#cutin { position: absolute; left: 0; right: 0; top: 30%; height: 96px; pointer-events: none; display: none; }

#cutin .band { position: absolute; inset: 14px 0; background: linear-gradient(90deg, rgba(168,68,44,0), rgba(168,68,44,.92) 20%, rgba(168,68,44,.92) 80%, rgba(168,68,44,0)); animation: band 1.4s ease-out forwards; }

#cutin .tx { position: absolute; left: 0; right: 0; top: 30px; text-align: center; font-family: var(--f-display); font-size: 26px; color: #fff6e0; -webkit-text-stroke: 5px rgba(70,20,10,.8); paint-order: stroke fill; animation: band 1.4s ease-out forwards; }
@keyframes band { 0% { opacity: 0; transform: scaleY(.2); } 12% { opacity: 1; transform: scaleY(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
@keyframes inl { 0% { transform: translateX(-160px); } 15% { transform: translateX(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(10px); } }
@keyframes inr { 0% { transform: translateX(160px) scaleX(-1); } 15% { transform: translateX(0) scaleX(-1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.helpbtn { position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 92px; width: 34px; height: 34px; border-radius: 50%; background: rgba(43,28,22,.75); color: var(--paper); font-weight: 900; pointer-events: auto; }

/* ---------- 操作區 ---------- */
#dock { background: linear-gradient(var(--dock-2), var(--dock)); color: var(--paper); padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); display: grid; gap: 8px; position: relative; flex: 1; align-content: start; }
.econ { display: flex; align-items: center; gap: 8px; }

.gold.bump { animation: gb .3s; }
@keyframes gb { 50% { transform: scale(1.18); } }
.ebtn { display: grid; justify-items: center; gap: 1px; min-width: 54px; padding: 5px 8px; border-radius: 10px; background: #5a443a; box-shadow: 0 3px 0 #21150f; font-weight: 900; font-size: 13px; color: var(--paper); }
.ebtn small { font-size: 11px; color: var(--gold-2); display: flex; align-items: center; gap: 2px; }

.items { display: flex; gap: 6px; min-height: 36px; align-items: center; overflow-x: auto; scrollbar-width: none; }

.item.done { box-shadow: inset 0 0 0 2px var(--gold-2); background: #6a4a2a; }
.item svg { width: 26px; height: 26px; pointer-events: none; }
.item.sel { outline: 3px solid var(--gold-2); }
.item.new { animation: inew .6s cubic-bezier(.2,.9,.3,1.4); }

.shopwrap { position: relative; }
.shop { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; perspective: 600px; max-width: 540px; margin: 0 auto; }
.card { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; background: var(--cc, #9a8a7a); padding: 3px; box-shadow: 0 4px 0 rgba(0,0,0,.4); transform-style: preserve-3d; transition: transform .15s; overflow: hidden; }

.card img { position: absolute; left: 50%; top: -2%; width: 112%; transform: translateX(-50%); pointer-events: none; }
.card .nm { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(43,28,22,.86); color: var(--paper); font-size: 12px; font-weight: 900; padding: 2px 4px 3px; display: flex; justify-content: space-between; align-items: center; }

function checkMerge(G, pid) {
  const P = G.players[pid];
  for (let guard = 0; guard < 6; guard++) {
    const groups = {};
    const benchOnly = G.phase !== 'prep'; // 戰鬥中只合成備戰席上的，場上的等回合結束再合
    for (const o of ownUnits(G, pid)) { if (o.u.star >= 3 || (benchOnly && o.zone === 'board')) continue; const k = o.u.key + '|' + o.u.star; (groups[k] = groups[k] || []).push(o); }
    let merged = false;
    for (const k in groups) {
      const g = groups[k]; if (g.length < 3) continue;
      g.sort((a, b) => (a.zone === 'board' ? 0 : 1) - (b.zone === 'board' ? 0 : 1));
      const keep = g[0], rest = g.slice(1, 3);
      let items = keep.u.items.slice();
      for (const o of rest) { items = items.concat(o.u.items); if (o.zone === 'board') delete G.board[o.cell]; else P.bench[o.i] = null; }
      keep.u.star++;
      keep.u.items = items.slice(0, CFG.MAX_ITEMS);
      P.items.push(...items.slice(CFG.MAX_ITEMS));
      G.log.push({ k: 'merge', pid, key: keep.u.key, star: keep.u.star, uid: keep.u.uid, eaten: rest.map(o => o.u.uid) });
      merged = true; break;
    }
    if (!merged) break;
  }
}

function canAfford(P, key) { return P.gold >= ANIMALS[key].cost; }
function rollShop(G, P) {
  const odds = CFG.SHOP_ODDS[P.level];
  P.shop = [];
  for (let i = 0; i < CFG.SHOP_SIZE; i++) {
    let roll = G.rng(100), cost = 1;
    for (let c = 0; c < odds.length; c++) { if (roll < odds[c]) { cost = c + 1; break; } roll -= odds[c]; }
    const mig = k => !G.migration || ANIMALS[k].traits.includes(G.migration);
    let keys = Object.keys(ANIMALS).filter(k => ANIMALS[k].cost === cost && G.pool[k] > 0 && mig(k));
    if (!keys.length && G.migration) keys = Object.keys(ANIMALS).filter(k => G.pool[k] > 0 && mig(k) && ANIMALS[k].cost <= cost);
    if (!keys.length) keys = Object.keys(ANIMALS).filter(k => G.pool[k] > 0 && ANIMALS[k].cost <= cost);
    if (!keys.length) { P.shop.push(null); continue; }
    let tot = 0; for (const k of keys) tot += G.pool[k];
    let r = G.rng(tot), pick = keys[0];
    for (const k of keys) { if (r < G.pool[k]) { pick = k; break; } r -= G.pool[k]; }
    P.shop.push(pick);
  }
}

// ---- 玩家動作（連線版由房主套用） ----
function act(G, pid, a) {
  const P = G.players[pid];
  if (G.phase === 'over' || G.phase === 'lobby' || P.out) return 'bad';
  if (G.phase !== 'prep') {
    // 戰鬥中：可以買賣、刷新、升級、整理備戰席；場上的棋子不能動
    const onBoard = uid => ownUnits(G, pid).some(o => o.u.uid === uid && o.zone === 'board');
    if (a.t === 'move' && (a.to.zone !== 'bench' || onBoard(a.uid))) return 'board_locked';
    if ((a.t === 'sell' || a.t === 'equip' || (a.t === 'gift' && a.uid)) && onBoard(a.uid)) return 'board_locked';
  }
  switch (a.t) {
    case 'reroll': {
      const cost = P.firstRollFree ? 0 : rerollCost(P);
      if (P.gold < cost) return 'no_gold';
      P.gold -= cost; if (P.firstRollFree) P.firstRollFree = false; else if (P.freeRoll > 0 && cost === 0) P.freeRoll--;
      rollShop(G, P); G.log.push({ k: 'reroll', pid }); return 'ok';
    }
    case 'aug': {
      if (!P.augChoice || !P.augChoice.includes(a.id)) return 'bad';
      P.augChoice = null; P.augs.push(a.id); applyAugNow(G, P, a.id);
      G.log.push({ k: 'aug', pid, id: a.id }); return 'ok';
    }
    case 'lock': P.locked = !P.locked; return 'ok';
    case 'buy': {
      a.key = P.shop[a.slot]; const A = ANIMALS[a.key]; if (!A) return 'bad';
      if (G.pool[a.key] <= 0) return 'pool_empty';
      if (P.gold < A.cost) return 'no_gold';
      let slot = P.bench.indexOf(null);
      if (slot < 0) {
        const same = ownUnits(G, pid).filter(o => o.u.key === a.key && o.u.star === 1).length;
        if (same < 2) return 'bench_full';
      }
      P.gold -= A.cost; G.pool[a.key]--; P.shop[a.slot] = null;
      const u = newUnit(G, a.key, 1, pid);
      G.log.push({ k: 'buy', pid, uid: u.uid, slot: a.slot });
      if (slot >= 0) P.bench[slot] = u;
      else { P.bench.push(u); checkMerge(G, pid); compactBench(G, P); return 'ok'; }
      checkMerge(G, pid);
      return 'ok';
    }
    case 'sell': {
      const o = ownUnits(G, pid).find(o => o.u.uid === a.uid); if (!o) return 'bad';
      P.gold += sellValue(o.u); G.pool[o.u.key] += Math.pow(3, o.u.star - 1); G.log.push({ k: 'sell', pid, uid: o.u.uid, gold: sellValue(o.u) });
      P.items.push(...o.u.items);
      if (o.zone === 'board') delete G.board[o.cell]; else P.bench[o.i] = null;
      return 'ok';
    }
    case 'move': {
      const o = ownUnits(G, pid).find(o => o.u.uid === a.uid); if (!o) return moveMateUnit(G, pid, a); // 不是自己的：可能是在搬電腦隊友的棋子
      if (a.to.zone === 'bench') {
        const i = a.to.i, other = P.bench[i];
        if (o.zone === 'bench') { P.bench[o.i] = other; P.bench[i] = o.u; return 'ok'; }
        delete G.board[o.cell]; P.bench[i] = o.u; if (other) G.board[o.cell] = other;
        return 'ok';
      }
      const cell = a.to.cell;
      if (!canPlace(G, P, cell) || G.terrain[cellBase(cell)] === 'rock') return 'bad_cell';
      if (!inHalf(P.team, cell) && !(o.zone === 'board' && !inHalf(P.team, o.cell)) && intruders(G, pid) >= 1) return 'front_full';
      const occ = G.board[cell];
      if (occ && G.players[occ.owner].team !== P.team) return 'enemy_cell';
      if (occ && occ.owner !== pid) {
        // 跟隊友的棋子互換：只限電腦隊友（真人隊友的棋子不能動）
        const Mo = G.players[occ.owner];
        if (Mo.team !== P.team || !Mo.ai) return 'teammate_cell';
        if (o.zone === 'bench') { // 從備戰席放到電腦隊友的位置：電腦的棋子讓到它的備戰席
          if (G.phase !== 'prep' || boardCount(G, pid) >= popCap(P)) return 'teammate_cell';
          const sl = Mo.bench.indexOf(null); if (sl < 0) return 'teammate_cell';
          delete G.board[cell]; Mo.bench[sl] = occ; occ.pinned = false; P.bench[o.i] = null; G.board[cell] = o.u; return 'ok';
        }
        occ.pinned = true;
        G.board[o.cell] = occ; G.board[cell] = o.u; G.log.push({ k: 'swap', pid, uid: o.u.uid, other: occ.uid }); return 'ok';
      }
      if (o.zone === 'board') { delete G.board[o.cell]; if (occ) G.board[o.cell] = occ; G.board[cell] = o.u; return 'ok'; }
      if (!occ && boardCount(G, pid) >= popCap(P)) return 'pop_full';
      P.bench[o.i] = occ || null; G.board[cell] = o.u;
      return 'ok';
    }
    case 'level': {
      if (P.level >= CFG.MAX_LEVEL || P.gold < CFG.XP_COST) return 'no';
      P.gold -= CFG.XP_COST; addXp(P, CFG.XP_BUY); return 'ok';
    }
    case 'equip': {
      const it = P.items[a.idx]; if (!it) return 'bad';
      const tgt = ownUnits(G, pid).find(o => o.u.uid === a.uid); if (!tgt) return 'bad';
      const u = tgt.u;
      if (CONSUMABLES[it]) return useConsumable(G, P, a.idx, tgt);
      if (EMBLEMS[it]) {
        if (ANIMALS[u.key].traits.includes(EMBLEMS[it].trait) || u.items.includes(it)) return 'emblem_dup';
      }
      if (MATS[it]) {
        const mi = u.items.findIndex(x => MATS[x] && RECIPE[[x, it].sort().join('+')]);
        if (mi >= 0) { u.items[mi] = RECIPE[[u.items[mi], it].sort().join('+')]; P.items.splice(a.idx, 1); G.log.push({ k: 'craft', pid, item: u.items[mi], uid: u.uid }); return 'ok'; }
      }
      if (u.items.length >= CFG.MAX_ITEMS) return 'full';
      u.items.push(it); P.items.splice(a.idx, 1); G.log.push({ k: 'equip', pid, item: it, uid: u.uid }); return 'ok';
    }
    case 'gift': {
      const T = teammate(G, pid); if (!T) return 'bad';
      if (a.gold) {
        const g = Math.min(a.gold, P.gold, CFG.GIFT_GOLD_MAX - P.giftedGold); if (g <= 0) return 'limit';
        P.gold -= g; T.gold += g; P.giftedGold += g; G.log.push({ k: 'gift', pid, to: T.id, s: g + ' 金' }); return 'ok';
      }
      if (a.uid) {
        const o = ownUnits(G, pid).find(o => o.u.uid === a.uid); if (!o) return 'bad';
        const slot = T.bench.indexOf(null); if (slot < 0) return 'their_bench_full';
        if (o.zone === 'board') delete G.board[o.cell]; else P.bench[o.i] = null;
        o.u.owner = T.id; T.bench[slot] = o.u; checkMerge(G, T.id);
        G.log.push({ k: 'gift', pid, to: T.id, s: ANIMALS[o.u.key].name }); return 'ok';
      }
      if (a.item !== undefined) {
        const it = P.items[a.item]; if (!it) return 'bad';
        P.items.splice(a.item, 1); T.items.push(it);
        G.log.push({ k: 'gift', pid, to: T.id, s: (MATS[it] || ITEMS[it]).name }); return 'ok';
      }
      return 'bad';
    }
    case 'ready': P.ready = !P.ready; return 'ok';
    case 'vote': if (!G.portalVote || !G.portalVote.options.includes(a.id)) return 'bad'; P.vote = a.id; return 'ok';
    case 'draft': return draftPick(G, pid, a.i);
    case 'encounter': if (!G.encounter || !G.encounter.pending || G.teams[P.team].captain !== pid) return 'bad'; resolveEncounter(G, a.choice); return 'ok';
    case 'deposit': { const n = Math.min(a.n || 1, P.gold); if (n <= 0) return 'no_gold'; P.gold -= n; G.teams[P.team].bank += n; G.log.push({ k: 'bank', pid, n }); return 'ok'; }
    case 'withdraw': { const T = G.teams[P.team], n = Math.min(a.n || 1, T.bank); if (n <= 0) return 'bank_empty'; T.bank -= n; P.gold += n; G.log.push({ k: 'bank', pid, n: -n }); return 'ok'; }
    case 'captain': { const T = G.teams[P.team]; if (T.captain !== pid || !teammate(G, pid)) return 'not_captain'; T.captain = teammate(G, pid).id; G.log.push({ k: 'captain', pid, to: T.captain }); return 'ok'; }
    case 'cmd': {
      if (!G.rules.commands || G.phase !== 'combat') return 'bad';
      const bt = G.battles.find(b => b.teams.includes(P.team)); if (!bt) return 'bad';
      return battleCommand(bt.B, pid, a.type) ? 'ok' : 'cmd_used';
    }
    case 'aitoggle': { P.ai = !P.ai; if (P.ai) { P.ready = true; if (G.phase === 'prep') aiPrep(G, pid); } else P.ready = false; return 'ok'; }
    case 'surrender': { if (G.teams[P.team].out) return 'bad'; G.teams[P.team].hp = 0; G.surrendered = P.team; eliminate(G); return 'ok'; }
    case 'augroll': {
      if (!P.augChoice || P.augRolled[a.i] || !P.augChoice[a.i]) return 'bad';
      const tier = AUG[P.augChoice[a.i]].tier;
      const pool = AUGMENTS.filter(x => x.tier === tier && !P.augs.includes(x.id) && !P.augChoice.includes(x.id) && augOk(G, x)).map(x => x.id);

    }
    case 'ping': {
      const T = teammate(G, pid) || { ai: false };

        if (a.kind === 'place' && a.cell !== undefined) { T.avoidCells[a.cell] = true; aiSay(G, T.id, pid, '收到，那格留給你'); }
        if (a.kind === 'danger') aiSay(G, T.id, pid, '了解，我會小心那邊');

        if (a.kind === 'buy' && a.key) {

          if (i >= 0 && T.gold >= ANIMALS[a.key].cost && P.bench.indexOf(null) >= 0 && act(G, T.id, { t: 'buy', slot: i }) === 'ok') {

            if (bought && act(G, T.id, { t: 'gift', uid: bought.u.uid }) === 'ok') aiSay(G, T.id, pid, `買好了，${ANIMALS[a.key].name}給你！`);
          } else G.log.push({ k: 'pingfail', pid, to: T.id, key: a.key });

}
// 真人可以搬動 AI 隊友場上的棋子（只限準備階段、只在我方半場）；搬過的棋子 AI 不會再自己移回去
function moveMateUnit(G, pid, a) {
  const P = G.players[pid], M = teammate(G, pid);
  if (!M || !M.ai || P.ai || G.phase !== 'prep' || !a.to || a.to.zone !== 'board') return 'bad';
  const o = ownUnits(G, M.id).find(x => x.u.uid === a.uid && x.zone === 'board'); if (!o) return 'bad';
  const cell = a.to.cell;
  if (!inHalf(P.team, cell) || G.terrain[cellBase(cell)] === 'rock') return 'bad_cell';
  const occ = G.board[cell];
  if (occ && G.players[occ.owner].team !== P.team) return 'enemy_cell';
  delete G.board[o.cell]; if (occ) { G.board[o.cell] = occ; if (occ.owner === M.id) occ.pinned = true; }
  G.board[cell] = o.u; o.u.pinned = true;
  G.log.push({ k: 'swap', pid, uid: o.u.uid, other: occ ? occ.uid : 0, mate: true }); return 'ok';
}
function addXp(P, n) {
  P.xp += n;
  while (P.level < CFG.MAX_LEVEL && P.xp >= CFG.XP_NEED[P.level]) { P.xp -= CFG.XP_NEED[P.level]; P.level++; }
  if (P.level >= CFG.MAX_LEVEL) P.xp = 0;
}

// ---- 地形 ----
function rollTerrain(G) {
  const st = stageOf(G.round);
  G.arena = ARENA_ORDER[(G.arenaStart + st - 1) % ARENA_ORDER.length];
  const A = ARENAS[G.arena];
  const n = A.count[0] + G.rng(A.count[1] - A.count[0] + 1) + (G.portal === 'quake' ? 2 : 0);
  const bag = []; for (const t in A.weights) for (let i = 0; i < A.weights[t]; i++) bag.push(t);
  const chosen = []; let rock = 0;
  for (let guard = 0; chosen.length < n && guard < 50; guard++) {
    const t = bag[G.rng(bag.length)];
    if (t === 'rock' && rock >= A.maxRock) continue;
    if (t === 'rock') rock++; chosen.push(t);
  }
  const used = {}; G.terrain = {}; G.height = {};
  // 高台：每座 2～3 格相連，雙方鏡像對稱；不放在已被岩石佔的位置
  const nh = (A.hills || [0, 0])[0] + G.rng(((A.hills || [0, 0])[1] - (A.hills || [0, 0])[0]) + 1);
  for (let h = 0; h < nh; h++) {
    for (let tries = 0; tries < 30; tries++) {
      const c = G.rng(CFG.COLS), r = G.rng(CFG.ROWS_HALF), size = 2 + G.rng(2), cells = [[c, r]];
      const dirs = [[1, 0], [0, 1], [-1, 0], [0, -1]];
      for (let g = 0; cells.length < size && g < 12; g++) { const b = cells[G.rng(cells.length)], d = dirs[G.rng(4)], nc = b[0] + d[0], nr = b[1] + d[1]; if (nc >= 0 && nc < CFG.COLS && nr >= 0 && nr < CFG.ROWS_HALF && !cells.some(x => x[0] === nc && x[1] === nr)) cells.push([nc, nr]); }
      if (cells.some(([cc, rr]) => G.height[rr * CFG.COLS + cc])) continue;
      for (const [cc, rr] of cells) { const k = rr * CFG.COLS + cc, [gc, gr] = toGlobal(1, cc, rr); G.height[k] = 1; G.height[gr * CFG.COLS + gc] = 1; }
      break;
    }
  }
  for (const t of chosen) {
    for (let tries = 0; tries < 40; tries++) {
      const c = G.rng(CFG.COLS), r = G.rng(CFG.ROWS_HALF), k = r * CFG.COLS + c;
      if (used[k]) continue;
      const [gc, gr] = toGlobal(1, c, r), k2 = gr * CFG.COLS + gc;
      if (t === 'rock' && Object.keys(G.board).some(b => cellBase(+b) === k || cellBase(+b) === k2)) continue;
      if (G.height[k] && (t === 'water' || t === 'rock' || t === 'bounce')) continue; // 高台上不放水、岩石、彈射
      used[k] = 1; G.terrain[k] = t; G.terrain[k2] = t; break;
    }
  }
}

// ---- 回合流程 ----
function startGame(G) {
  // 電腦模仿玩家：從高勝率的玩家陣容裡挑一套當目標（依勝率加權）
  for (const P of G.players) if (P.ai) P.target = metaPick(G);
  delete G.meta;
  G.round = 0; G.arenaStart = G.rng(ARENA_ORDER.length);
  if (G.rules.portals) {
    const pool = PORTALS.map(p => p.id), opts = []; while (opts.length < 3) opts.push(pool.splice(G.rng(pool.length), 1)[0]);
    G.portalVote = { options: opts, votes: {} };
    for (const P of G.players) if (P.ai) P.vote = opts[G.rng(3)];
  }
  startPrep(G);
}
function resolvePortal(G) {
  if (!G.portalVote) return;
  const opts = G.portalVote.options, cnt = {};
  for (const P of G.players) { const v = P.vote || opts[G.rng(3)]; cnt[v] = (cnt[v] || 0) + 1; }
  let best = opts[0], bn = -1; for (const o of opts) { const n = (cnt[o] || 0) + G.rng(100) / 1000; if (n > bn) { bn = n; best = o; } }
  G.portal = best; G.portalVote = null; G.log.push({ k: 'portal', id: best });
  if (best === 'blitz') { G.rules.prepSec = 20; for (const T of G.teams) T.hp = Math.min(T.hp, 80); }
  if (best === 'headstart') for (const P of G.players) { P.level = Math.max(P.level, 3); P.xp = 0; P.gold += 3; rollShop(G, P); }
  if (best === 'crowd') for (const k in G.pool) if (G.pool[k] > 0) G.pool[k] = Math.floor(G.pool[k] * 13 / 10);
  if (best === 'freeroll') for (const P of G.players) P.firstRollFree = true;
  for (const P of G.players) if (P.ai) aiPrep(G, P.id);
}
function startPrep(G) {
  G.round++;
  const R = G.round;
  if (stageStart(R)) rollTerrain(G);
  for (const P of G.players) {
    P.ready = false; P.giftedGold = 0;
    if (P.out) { P.ready = true; P.augChoice = null; continue; }
    if (R === 1) {
      const keys = Object.keys(ANIMALS).filter(k => ANIMALS[k].cost === 1);
      const k = keys[G.rng(keys.length)]; G.pool[k]--; P.bench[0] = newUnit(G, k, 1, P.id);
    } else {
      const T = G.teams[P.team], s = Math.abs(T.streak);
      const inc = { base: CFG.INCOME_BY_STAGE[Math.min(stageOf(R), CFG.INCOME_BY_STAGE.length - 1)] || CFG.BASE_INCOME, interest: Math.min(CFG.MAX_INTEREST + (P.augs.includes('piggy') ? 1 : 0), Math.floor(P.gold / 10)), streak: s >= 6 ? 3 : s >= 4 ? 2 : s >= 2 ? 1 : 0 };
      if (G.portal === 'goldseason') inc.base += 1;
      P.gold += inc.base + inc.interest + inc.streak; P.lastIncome = inc;
      addXp(P, CFG.XP_ROUND + (G.portal === 'xpboost' ? 2 : 0));
      if (G.portal === 'freeroll') P.firstRollFree = true;
    }
    if (!P.locked) rollShop(G, P); P.locked = false;
    if (P.discount > 0 && R > 1) P.discount--;
  }
  G.phase = 'prep'; for (const P of G.players) checkMerge(G, P.id);
  if (R > 1) for (const T of G.teams) { const i = Math.min(CFG.BANK_INTEREST_MAX, Math.floor(T.bank / 10)); T.bank += i; T.bankInt = i; }
  for (const P of G.players) { P.reserved = {}; P.avoidCells = {}; }
  G.pings = [];
  rollWeather(G);
  G.migration = null;
  if (G.rules.encounters && CFG.ENCOUNTER_ROUNDS.includes(R)) startEncounter(G);
  if (G.rules.augments && CFG.AUG_ROUNDS.includes(R)) offerAugments(G);
  if (G.rules.carousel && CFG.CAROUSEL_ROUNDS.includes(R)) startDraft(G);
  G.phase = 'prep'; G.timer = G.rules.prepSec * 1000;

function buildAnimal(key) {
  geos();
  const R = { key, M: Mats(), root: new THREE.Group(), fly: 0 };
  R.yaw = saveBase(grp(R.root));
  (BUILD[key] || BUILD.hare)(R);
  for (const k of ['armL', 'armR', 'legL', 'legR', 'head', 'body', 'tail', 'earL', 'earR', 'wingL', 'wingR', 'jaw', 'jawU', 'mane', 'spikes', 'torso', 'mouth', 'horn', 'beak', 'fan', 'blow']) if (R[k]) saveBase(R[k]);
  R.root.traverse(o => { if (o.isMesh) { o.castShadow = false; o.userData.unit = true; } });
  if (key === 'minibee') R.root.scale.setScalar(0.55);
  mergeRig(R);
  R.groups = []; R.root.traverse(o => { if (o.userData.b) R.groups.push(o); });
  return R;
}

// 同一個骨架節點底下的靜態網格合併成一個（頂點色），每隻約 10 次繪製
function mergeRig(R) {
  const keep = new Set([R.torso, R.mouth, R.prop, R.tongue].filter(Boolean));
  const vmat = new THREE.MeshToonMaterial({ color: 0xffffff, vertexColors: true, gradientMap: toonGrad() });
  vmat.userData.op = 1;
  const nodes = []; R.root.traverse(o => { if (!o.isMesh) nodes.push(o); });
  for (const n of nodes) {
    const list = n.children.filter(c => c.isMesh && !keep.has(c) && c.visible && c.material.isMeshToonMaterial && !c.material.transparent && c.material.side !== THREE.DoubleSide && c.material !== R.eyeMat);
    if (list.length < 2) continue;
    let cnt = 0; const gs = [];
    for (const c of list) { c.updateMatrix(); const g = (c.geometry.index ? c.geometry.toNonIndexed() : c.geometry.clone()); g.applyMatrix4(c.matrix); gs.push([g, c.material.color]); cnt += g.attributes.position.count; }
    const pos = new Float32Array(cnt * 3), nor = new Float32Array(cnt * 3), col = new Float32Array(cnt * 3); let off = 0;
    for (const [g, c] of gs) { const k = g.attributes.position.count; pos.set(g.attributes.position.array, off * 3); nor.set(g.attributes.normal.array, off * 3); for (let i = 0; i < k; i++) { col[(off + i) * 3] = c.r; col[(off + i) * 3 + 1] = c.g; col[(off + i) * 3 + 2] = c.b; } off += k; g.dispose(); }
    const mg = new THREE.BufferGeometry(); mg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); mg.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); mg.setAttribute('color', new THREE.BufferAttribute(col, 3));
    for (const c of list) n.remove(c);
    const mm = new THREE.Mesh(mg, vmat); mm.userData.unit = true; n.add(mm);
  }
  // 其餘同材質（眼睛、眼神光、腮紅）也合併
  for (const n of nodes) {
    const by = new Map();
    for (const c of n.children) if (c.isMesh && !keep.has(c) && c.material !== vmat && c.visible) { if (!by.has(c.material)) by.set(c.material, []); by.get(c.material).push(c); }
    for (const [m, list] of by) {
      if (list.length < 2) continue;
      let cnt = 0; const gs = [];
      for (const c of list) { c.updateMatrix(); const g = (c.geometry.index ? c.geometry.toNonIndexed() : c.geometry.clone()); g.applyMatrix4(c.matrix); gs.push(g); cnt += g.attributes.position.count; }
      const pos = new Float32Array(cnt * 3), nor = new Float32Array(cnt * 3); let off = 0;
      for (const g of gs) { pos.set(g.attributes.position.array, off * 3); nor.set(g.attributes.normal.array, off * 3); off += g.attributes.position.count; g.dispose(); }
      const mg = new THREE.BufferGeometry(); mg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); mg.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      for (const c of list) n.remove(c);
      n.add(new THREE.Mesh(mg, m));
    }
  }
  R.mats = [vmat].concat(R.M.list);
}

const ease = { out: p => 1 - (1 - p) * (1 - p), inOut: p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2, back: p => 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2) };
const bell = (p, a, b) => p < a ? 0 : p > b ? 0 : Math.sin((p - a) / (b - a) * Math.PI);
const ramp = (p, a, b) => p <= a ? 0 : p >= b ? 1 : (p - a) / (b - a);
// 爪擊：手從左上舉起往右下揮（s = 1 右手，-1 左手）
function clawSwing(R, p, s, big) {
  const arm = s > 0 ? R.armR : R.armL; if (!arm) return;
  const up = ramp(p, 0, 0.4), down = ramp(p, 0.4, 0.62), back = ramp(p, 0.75, 1);
  const k = ease.out(up) * (1 - down), sw = ease.inOut(down) * (1 - back);
  arm.rotation.x += -2.6 * k + 1.1 * sw - 0.3 * (1 - back) * down;
  arm.rotation.z += s * (0.9 * k - 1.1 * sw) * (big ? 1.3 : 1);
  R.body.rotation.y += s * (0.35 * k - 0.5 * sw);
  R.body.position.z += 0.12 * sw;
}
function lunge(R, p, dist, at) { const f = bell(p, at || 0.25, 0.85); R.body.position.z += f * dist; R.body.rotation.x += f * 0.35; return f; }
function hopUp(R, p, h) { R.body.position.y += Math.sin(Math.min(1, p) * Math.PI) * h; }

// 每幀姿勢：st = {t 秒, moving, sleep, stun, act:{kind,p}, dead:p, hit:p, night, face}
function poseRig(R, st) {
  for (const g of R.groups) resetG(g);
  const t = st.t + R.phase;
  // 待機呼吸
  const br = Math.sin(t * 2.4);
  if (R.torso) R.torso.scale.y *= 1 + 0.03 * br;
  R.head.position.y += 0.008 * br;
  R.head.rotation.z += 0.04 * Math.sin(t * 1.1);
  if (R.tail) { R.tail.rotation.y += 0.25 * Math.sin(t * 2); R.tail.rotation.z += 0.08 * Math.sin(t * 1.3); }
  if (R.earL) { const tw = Math.max(0, Math.sin(t * 0.9) - 0.92) * 6; R.earL.rotation.z += 0.3 * tw; R.earR.rotation.z -= 0.2 * tw; }
  if (R.tents) R.tents.forEach((seg, i) => seg.forEach((s, k) => { s.rotation.x += 0.25 * Math.sin(t * 2.2 + i + k * 0.8); }));
  if (R.trunk) R.trunk.forEach((s, k) => { s.rotation.z += 0.08 * Math.sin(t * 1.6 + k * 0.6); });
  if (R.segs) R.segs.forEach((s, k) => { s.rotation.z += 0.12 * Math.sin(t * 2.4 + k * 0.9); s.rotation.x += 0.05 * Math.sin(t * 1.7 + k); });
  if (R.fan) { R.fan.rotation.z += 0.03 * Math.sin(t * 1.3); R.fan.scale.y *= 1 + 0.03 * Math.sin(t * 2.1); }
  if (R.earL && R.key === 'elephant') { R.earL.rotation.y += 0.15 * Math.sin(t * 2); R.earR.rotation.y -= 0.15 * Math.sin(t * 2); }
  if (R.fly) {
    R.body.position.y += R.fly + 0.05 * Math.sin(t * 4);
    const fl = R.key === 'bat' ? Math.sin(t * 14) * 0.7 : Math.sin(t * 60) * 0.5;
    if (R.wingL) { R.wingL.rotation.z += fl; R.wingR.rotation.z -= fl; }
  }
  // 貓頭鷹偶爾轉頭 180°
  if (R.key === 'owl' && !st.act) { const c = (t % 9); R.head.rotation.y += c > 7 ? Math.sin((c - 7) / 2 * Math.PI) * Math.PI * 0.95 : 0; }
  // 移動：擠壓與伸展（起步壓扁、空中拉長、落地回彈）
  if (st.moveP !== null && st.moveP !== undefined) {
    const k = st.moveP, sy = 1 - 0.13 * bell(k, 0, 0.22) + 0.12 * bell(k, 0.18, 0.78) - 0.12 * bell(k, 0.75, 1);
    R.body.scale.y *= sy; R.body.scale.x *= 1 - (sy - 1) * 0.6; R.body.scale.z *= 1 - (sy - 1) * 0.6;
    if (R.legL && !R.fly) { R.legL.rotation.x += 0.6 * Math.sin(k * Math.PI * 2); R.legR.rotation.x -= 0.6 * Math.sin(k * Math.PI * 2); }
    R.body.rotation.x += 0.12 * bell(k, 0.1, 0.9);
  }
  if (st.land !== null && st.land !== undefined) { const k = st.land, sq = 0.16 * Math.sin(k * Math.PI) * (1 - k) - 0.05 * Math.sin(k * Math.PI * 2) * k; R.body.scale.y *= 1 - sq; R.body.scale.x *= 1 + sq * 0.6; R.body.scale.z *= 1 + sq * 0.6; }
  if (st.moving) {
    const ph = t * 13;
    R.body.position.y += Math.abs(Math.sin(ph)) * (R.fly ? 0.03 : 0.08);
    R.body.rotation.z += 0.08 * Math.sin(ph);
    if (R.legL && !R.fly) { R.legL.rotation.x += 0.7 * Math.sin(ph); R.legR.rotation.x -= 0.7 * Math.sin(ph); }
    if (R.armL && !R.wingL) { R.armL.rotation.x -= 0.5 * Math.sin(ph); R.armR.rotation.x += 0.5 * Math.sin(ph); }
  }
  if (st.sleep) {
    R.body.rotation.x += 0.35; R.body.position.y -= 0.05; R.head.rotation.x += 0.45;
    R.armL.rotation.x -= 1.0; R.armR.rotation.x -= 1.0; R.armL.rotation.z += 0.5; R.armR.rotation.z -= 0.5;
    R.torso.scale.y *= 1 + 0.05 * Math.sin(t * 1.2);
  }
  if (st.act) { const A = (ACT[R.key] || {})[st.act.kind]; if (A) A.fn(R, Math.min(1, st.act.p)); if (st.act.kind === 'atk' && R.melee) { R.body.position.z -= 0.1 * bell(st.act.p, 0, 0.24); R.body.scale.z *= 1 - 0.08 * bell(st.act.p, 0, 0.24); } }
  if (st.stun) R.head.rotation.z += 0.18 * Math.sin(t * 6);

  if (st.dead !== undefined) { const d = Math.min(1, st.dead); R.body.rotation.z += 0.5 * ease.out(Math.min(1, d * 3)) * (R.phase > 1.5 ? 1 : -1); R.yaw.rotation.y += ease.inOut(d) * Math.PI * 4; R.body.position.y += 0.25 * ease.out(d); const sc = 1 - ramp(d, 0.35, 1); R.yaw.scale.setScalar(Math.max(0.001, sc)); }
  else R.yaw.scale.setScalar(1);

const CAM_FIT = 1; // 額外鏡頭距離倍率（1 = 剛好把整個棋盤＋備戰席放進畫面；數字越大越遠）
function s3Resize() {

  for (const vr of [0, CFG.ROWS - 1]) { const [x0, z] = cellWorld(0, vr), [x1] = cellWorld(CFG.COLS - 1, vr); pts.push([x0 - 0.55, z], [x1 + 0.55, z]); }

    S3.cam.position.copy(S3.camBase); S3.cam.lookAt(S3.camLook); S3.cam.updateMatrixWorld();

// ---- 靜態物件合併（降低繪製次數，手機才跑得動）----
function mergeStatic(root) {
  root.updateMatrixWorld(true);
  const skip = new Set(S3.ambient.map(a => a.o));
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const buckets = {}, kill = [];
  root.traverse(o => {
    if (!o.isMesh || o.userData.tile || o.userData.benchPad || o.userData.noMerge) return;
    for (let p = o; p && p !== root; p = p.parent) if (skip.has(p)) return;
    const m = o.material; if (m.map || m.transparent || m.side === THREE.DoubleSide) return;
    const key = m.type + m.color.getHexString();
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
    (buckets[key] = buckets[key] || { m, gs: [] }).gs.push(g); kill.push(o);
  });
  for (const o of kill) o.parent.remove(o);
  for (const k in buckets) {
    const { m, gs } = buckets[k]; let n = 0; for (const g of gs) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3); let off = 0;
    for (const g of gs) { pos.set(g.attributes.position.array, off * 3); if (g.attributes.normal) nor.set(g.attributes.normal.array, off * 3); off += g.attributes.position.count; g.dispose(); }
    const mg = new THREE.BufferGeometry(); mg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); mg.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    root.add(new THREE.Mesh(mg, m));
  }
}

function lightning(a, b, col, life) {

const NUM_MAX = 36; // 同時顯示的傷害數字上限（效能調整參數）
function s3Num(k, text, cls, delay, big) {

  setTimeout(() => {

    S3.numN = S3.numN || 0;
    if (S3.numN > NUM_MAX * (S3.quality || 1) && !big && cls !== 'crit' && cls !== 'skill') return;
    S3.numN++; setTimeout(() => { S3.numN--; }, 900);

// ---- 點選：回傳 {type:'unit',k} | {type:'tile',vc,vr} | {type:'bench',i} | null ----
function s3PickAt(cx, cy) {
  const r = S3.renderer.domElement.getBoundingClientRect();
  const nx = (cx - r.left) / r.width * 2 - 1, ny = -((cy - r.top) / r.height) * 2 + 1;
  S3.ray.setFromCamera({ x: nx, y: ny }, S3.cam);
  // 單位（用簡單圓柱碰撞，比逐面測試穩）
  let best = null, bd = 1e9;
  for (const k in S3.V) {
    const v = S3.V[k]; if (v.deadT !== null || v.dragging) continue;
    const c = v.pos.clone().add(V3(0, 0.45 * (v.scale || 1), 0));
    const d = S3.ray.ray.distanceSqToPoint(c), rad = 0.42 * (v.scale || 1);
    if (d < rad * rad) { const dist = S3.ray.ray.origin.distanceTo(c); if (dist < bd) { bd = dist; best = { type: 'unit', k }; } }
  }
  if (best) return best;
  const hits = S3.ray.intersectObjects(S3.tiles.concat(S3.bench), false);
  if (hits.length) { const u = hits[0].object.userData; return u.tile ? { type: 'tile', vc: u.vc, vr: u.vr } : { type: 'bench', i: u.i }; }
  return null;
}
function s3GroundAt(cx, cy) {
  const r = S3.renderer.domElement.getBoundingClientRect();
  S3.ray.setFromCamera({ x: (cx - r.left) / r.width * 2 - 1, y: -((cy - r.top) / r.height) * 2 + 1 }, S3.cam);
  const p = V3(0, 0, 0); S3.ray.ray.intersectPlane(new THREE.Plane(V3(0, 1, 0), 0), p); return p;
}
function s3NearestSlot(p) {
  // 依世界座標找最近的格子或備戰席
  let best = null, bd = 0.6;
  for (const t of S3.tiles) { const d = Math.hypot(t.position.x - p.x, t.position.z - p.z); if (d < bd) { bd = d; best = { type: 'tile', vc: t.userData.vc, vr: t.userData.vr, o: t }; } }
  for (const b of S3.bench) { const d = Math.hypot(b.position.x - p.x, b.position.z - p.z); if (d < bd) { bd = d; best = { type: 'bench', i: b.userData.i, o: b }; } }
  return best;
}
// 格子高亮：map key -> color
function s3Highlight(list, rows) {
  for (const t of S3.tiles) { delete t.userData.hl; t.material.color.set(0xffffff); }
  for (const b of S3.bench) b.material.emissive.setHex(0);
  S3.hlObjs = []; S3.gridOn = list.length > 0; S3.gridRows = rows || CFG.ROWS_HALF;
  for (const h of list) {
    const o = h.type === 'tile' ? S3.tiles[h.vr * CFG.COLS + h.vc] : S3.bench[h.i]; if (!o) continue;
    o.userData.hl = h.col;
    if (h.type === 'tile') { const c = new THREE.Color(h.col); c.r = Math.min(1, c.r * 2.6 + 0.15); c.g = Math.min(1, c.g * 2.6 + 0.15); c.b = Math.min(1, c.b * 2.6 + 0.15); o.material.color.copy(c); }
    else { o.material.emissive.setHex(h.col); S3.hlObjs.push(o); }
  }
}

// ---- 每階段 ----
function featuresPhase(ph) {

    sfx('round'); musicStart(G.arena);

    if (G.round === 1 && !G.tutDone) { G.tutDone = true; try { if (!localStorage.getItem('zoo_tut')) G.tutPending = performance.now() + 1200; } catch (e) {} }
  } else if (ph === 'combat') {
    $('cmdbar').hidden = !G.rules.commands;
    for (const b of document.querySelectorAll('.cmd')) b.disabled = false;
    if (METER.on) $('meter').hidden = false;
    renderWeatherChip(); eggCombatStart();
  } else if (ph === 'result') {
    $('cmdbar').hidden = true;
    const r = G.lastResult, t = myTeam();
    if (r.win[t]) { sfx('win'); avatarMood('win'); } else if (!r.pve) { sfx('lose'); avatarMood('sad'); } else sfx('coin');
    renderMeter(true);
    if (r.ark) toast('最後的方舟：這次敗北不扣血', 2000);
  } else if (ph === 'over') {
    PROFILE.games++; const win = G.winner === myTeam(); if (win) PROFILE.wins++;
    const prism = G.players[ME].augs.filter(a => AUG[a].tier === 3).length;
    saveProfile();
    if (win) unlockSkin('gold');
    if (PROFILE.games >= 3) unlockSkin('night');
    if (win && G.teams[myTeam()].hp >= 50) unlockSkin('sakura');
    if (prism >= 2) unlockSkin('jade');
    sfx(win ? 'win' : 'lose');
    $('cmdbar').hidden = true;
  }
}

  else { const m = $('modal2'); if (m && !m.hidden && ['portal', 'draft', 'captain'].includes(m.dataset.k)) closeModal(); }

  if (METER.on && now - METER.last > 300 && (G.phase === 'combat' || G.phase === 'result' || REPLAY)) renderMeter();

    case 'die': sfx('death', 60); break;

// ---- 陣容存檔 ----
function saveFormation(i) {
  const t = myTeam(), list = [];
  for (const k in G.board) { const u = G.board[k]; if (u.owner !== ME) continue; const [c, r] = cellRC(+k), [lc, lr] = toLocal(SIDE(t), c, r); list.push({ key: u.key, star: u.star, lc, lr, w: CFG.COLS, h: CFG.ROWS_HALF }); }
  try { localStorage.setItem('zoo_form' + i, JSON.stringify(list)); } catch (e) {}
  toast(`陣容 ${i} 已存檔（${list.length} 隻）`);
}
function loadFormation(i) {
  if (G.phase !== 'prep') { toast('準備階段才能擺陣'); return; }
  let list = []; try { list = JSON.parse(localStorage.getItem('zoo_form' + i) || '[]'); } catch (e) {}
  const t = myTeam(), used = {}; let n = 0;
  for (const it of list) {
    const cand = ownUnits(G, ME).filter(o => o.u.key === it.key && !used[o.u.uid]).sort((a, b) => Math.abs(a.u.star - it.star) - Math.abs(b.u.star - it.star))[0];
    if (!cand) continue;
    used[cand.u.uid] = 1;
    const lc = it.lc + (CFG.COLS - (it.w || 7)) / 2, lr = it.lr + (CFG.ROWS_HALF - (it.h || 4)); // 舊存檔（7×8）換算到現在的棋盤：左右置中、前排對齊
    if (lc < 0 || lc >= CFG.COLS || lr < 0 || lr >= CFG.ROWS_HALF) continue;
    const [gc, gr] = toGlobal(SIDE(t), lc, lr);
    if (actMe({ t: 'move', uid: cand.u.uid, to: { zone: 'board', cell: teamCell(t, gr * CFG.COLS + gc) } }) === 'ok') n++;
  }
  processLog(); renderPrep(); sfx('place');
  toast(n ? `依陣容 ${i} 擺好 ${n} 隻` : '沒有符合陣容的棋子');
}

// ---- 回放 ----
function startReplay() {
  const bt = G.battles.find(b => b.teams.includes(myTeam())); if (!bt || !bt.input) return;
  const B = createBattle(JSON.parse(JSON.stringify(bt.input)));
  for (const k in S3.V) if (k[0] === 'b') s3Remove(k);
  REPLAY = { B, acc: 0, end: 0 };
  cv = { bt: { B, teams: bt.teams }, B, vt: bt.teams[0] === myTeam() ? 0 : 1, zonePos: {}, lastCell: {}, replay: true };
  G.paused = true; sel = null; renderSheet();
  s3SetTerrain(B.terrain, cv.vt, B.temp, B.height);
  $('stage').insertAdjacentHTML('beforeend', '<div class="replaybar" id="replaybar">回放中<button class="btn" id="rpSlow">0.5×</button><button class="btn" id="rpNorm">1×</button><button class="btn primary" id="rpEnd">結束回放</button></div>');
  $('rpSlow').onclick = () => { G.speed = 0.5; }; $('rpNorm').onclick = () => { G.speed = 1; }; $('rpEnd').onclick = () => endReplay();
  banner('戰鬥回放', '可調整速度'); $('meter').hidden = !METER.on;
}
function replayFrame(dt) {
  const R = REPLAY;
  if (!R.B.over) { R.acc += dt * 1000 * (G.speed || 1); while (R.acc >= CFG.TICK_MS && !R.B.over) { R.acc -= CFG.TICK_MS; step(R.B); } }
  else { R.end += dt; if (R.end > 2.5) { endReplay(); return; } }
  combatSync(); handleBattleEvents(cv.bt);
}
function endReplay() {
  if (!REPLAY) return;
  REPLAY = null; G.paused = false; const b = $('replaybar'); if (b) b.remove();
  for (const k in S3.V) if (k[0] === 'b') s3Remove(k);
  cv = null; S3.nightTarget = 0; renderPrep();
}

function startPress(e, where, slot, instant) {
  if (!G || G.phase === 'over') return;
  const x = e.clientX, y = e.clientY;
  const fire = () => {
    PRESS = null;
    let tgt = null;

  halloween: { name: '萬聖夜',     hint: '10 月 25～31 日玩玩看' },
};
const EGG_POKE_TAPS = 5, EGG_CHICK_TAPS = 6; // 連點幾下觸發（可調）
// 被戳時的台詞（每隻一句，沒寫的用預設）
const POKE_LINES = {
  hedgehog: '別摸！會刺手喔', squirrel: '我的松果不分你', wolf: '嗷嗚～別鬧', frog: '呱！（舌頭收不回來）', bat: '我白天要睡覺…',
  redpanda: '看我站起來有多高！', skunk: '再戳我就放臭氣了', croc: '我只是在微笑而已', bee: '嗡嗡嗡，我很忙', koala: 'Zzz…再五分鐘…',
  cheetah: '你追不到我的', octopus: '八隻手都在忙', owl: '咕咕，現在幾點？', elephant: '我記得你戳過我', lion: '本王准你摸頭',
  penguin: '肚子滑起來很快喔', rhino: '近視眼，你是誰？', chameleon: '你看不到我、你看不到我', fox: '叮咚叮咚，狐狸怎麼叫？', eagle: '我在高空就看到你了',
  eel: '小心觸電 ⚡', gorilla: '（捶胸）我很溫柔的', whale: '噗——（噴水）', peacock: '我是不是很美？', komodo: '我口水有毒，退後',
};
let EGG_FOUND = (() => { try { return JSON.parse(localStorage.getItem('zoo_eggs') || '{}') || {}; } catch (e) { return {}; } })();
const EGG_STATE = { taps: { k: null, n: 0, t: 0 }, chick: { n: 0, t: 0 }, keys: [], holiday: null, decoKey: '', snowAcc: 0, shownThisGame: {} };

function eggFound(id) {
  if (!EGGS[id]) return;
  const first = !EGG_FOUND[id];
  EGG_FOUND[id] = 1; try { localStorage.setItem('zoo_eggs', JSON.stringify(EGG_FOUND)); } catch (e) {}
  if (first) { toast(`發現彩蛋：${EGGS[id].name}（${Object.keys(EGG_FOUND).length}/${Object.keys(EGGS).length}）`, 2600); sfx('star'); }
}
function eggPanel() {
  const ids = Object.keys(EGGS), n = ids.filter(i => EGG_FOUND[i]).length;
  return `<div class="eggs"><b>彩蛋 ${n}/${ids.length}</b><div>${ids.map(i => `<span class="${EGG_FOUND[i] ? 'ok' : ''}">${EGG_FOUND[i] ? '🥚 ' + EGGS[i].name : '？？？　' + EGGS[i].hint}</span>`).join('')}</div></div>`;
}

// ---- 1. 戳戳樂：連點同一隻動物 ----
function eggTapUnit(k) {
  const now = performance.now(), T = EGG_STATE.taps;
  if (T.k !== k || now - T.t > 700) { T.k = k; T.n = 0; }
  T.n++; T.t = now;
  const v = S3.V[k]; if (!v) return;
  if (T.n >= 2 && T.n < EGG_POKE_TAPS) { v.pop = nowS(); sfx('click'); }
  if (T.n >= EGG_POKE_TAPS) {
    T.n = 0;
    const key = v.unitKey, A = (ACT[key] || {}).skill;
    if (A && v.mode === 'prep') v.act = { kind: 'skill', t0: nowS(), dur: A.dur }; // 表演自己的技能動作（不會真的放技能）
    eggBubble(k, POKE_LINES[key] || '別戳了啦！');
    const p = posOf(k, 1.0); if (p) for (let i = 0; i < 5; i++) sprite('heart', p.clone(), { scale: 0.16, scale1: 0.05, life: 0.9, vel: V3((Math.random() - .5) * 1.2, 1.2 + Math.random(), 0), g: -1, color: 0xff7a9a, delay: i * 0.05 });
    eggFound('poke');
  }
}
function eggBubble(k, text) {
  const v = S3.V[k]; if (!v) return;
  const d = document.createElement('div'); d.className = 'eggbub'; d.textContent = text; S3.ov.appendChild(d);
  const t0 = performance.now();
  const tick = () => { const vv = S3.V[k]; if (!vv || performance.now() - t0 > 2200) { d.remove(); return; } const s = toScreen(v3top(vv)); d.style.transform = `translate(${Math.round(s[0])}px,${Math.round(s[1] - 26)}px) translate(-50%,-100%)`; requestAnimationFrame(tick); };
  tick();
}

// ---- 2. 小雞舞會：連點場邊的小小英雄 ----
function eggTapChick(cx, cy) {
  if (!AVATARS || !AVATARS[0]) return false;
  const a = AVATARS[0], cr = S3.renderer.domElement.getBoundingClientRect();
  const s = toScreen(a.R.root.position.clone().add(V3(0, 0.4, 0)));
  if (Math.hypot(cx - cr.left - s[0], cy - cr.top - s[1]) > 36) return false;
  const now = performance.now(), C = EGG_STATE.chick;
  if (now - C.t > 900) C.n = 0;
  C.n++; C.t = now;
  a.mood = 'win'; a.moodUntil = nowS() + 0.5; sfx('click');
  if (C.n >= EGG_CHICK_TAPS) {
    C.n = 0; a.mood = 'win'; a.moodUntil = nowS() + 4; a.dance = nowS();
    const p = a.R.root.position.clone().add(V3(0, 0.8, 0));
    for (let i = 0; i < 18; i++) sprite(i % 2 ? 'star' : 'spark', p.clone(), { scale: 0.18, scale1: 0.05, life: 1.2, vel: V3((Math.random() - .5) * 3, 1.5 + Math.random() * 2, (Math.random() - .5) * 2), g: -3, color: [0xffd34d, 0xff8a6a, 0x9be07a, 0x8fd3ff][i % 4], add: true, important: true });
    sfx('star'); eggFound('chick');
  }
  return true;
}
function eggChickPose() { // 在 avatarFrame 之後呼叫：跳舞時轉圈
  if (!AVATARS) return;
  const t = nowS();
  for (const a of AVATARS) if (a.dance && t - a.dance < 4) { const k = t - a.dance; a.R.yaw.rotation.y = k * 9; a.R.body.position.y += Math.abs(Math.sin(k * 10)) * 0.25; a.R.armL.rotation.z -= 1.2; a.R.armR.rotation.z += 1.2; }
}

// ---- 3. 派對模式：上上下下左右左右 B A，或大廳長按標題 ----
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
function eggKey(e) {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  EGG_STATE.keys.push(k); if (EGG_STATE.keys.length > KONAMI.length) EGG_STATE.keys.shift();
  if (EGG_STATE.keys.join() === KONAMI.join()) { EGG_STATE.keys = []; toggleParty(); }
}
function toggleParty() {
  S3.party = !S3.party;
  for (const k in S3.V) eggHat(S3.V[k].R, true);
  if (AVATARS) for (const a of AVATARS) eggHat(a.R, true);
  toast(S3.party ? '派對模式開啟！🎉（再輸入一次關閉）' : '派對模式關閉', 2200);
  if (S3.party) { if (typeof confetti === 'function' && !$('game').hidden) confetti(); eggFound('party'); }
}

// ---- 帽子：派對帽／聖誕帽／巫師帽 ----
function eggHatKind() { return S3.party ? 'party' : EGG_STATE.holiday === 'xmas' ? 'santa' : EGG_STATE.holiday === 'halloween' ? 'witch' : null; }
function eggHat(R, force) {
  const kind = eggHatKind();
  if (R.hatKind === kind && !force) return;
  if (R.hat) { R.head.remove(R.hat); disposeObj(R.hat); R.hat = null; }
  R.hatKind = kind;
  if (!kind || R.crown || !R.head) return;
  const g = new THREE.Group(), y = (R.headTop || 1) - 0.47;
  if (kind === 'party') {
    const cols = ['#ff7a9a', '#5ac8ff', '#ffd34d', '#9be07a'], c = cols[Math.floor(Math.random() * cols.length)];
    g.add(mesh(GEO.cone, T(c), [0, 0.11, 0], [0.09, 0.22, 0.09]));
    g.add(mesh(GEO.torus, T('#ffffff'), [0, 0.06, 0], [0.065, 0.065, 0.06], [Math.PI / 2, 0, 0]));
    g.add(mesh(GEO.sph, T('#fff3a0'), [0, 0.23, 0], 0.035));
    g.rotation.z = 0.25;
  } else if (kind === 'santa') {
    g.add(mesh(GEO.cone, T('#d9483a'), [0, 0.12, 0], [0.12, 0.24, 0.12]));
    g.add(mesh(GEO.torus, T('#f7f2ea'), [0, 0.01, 0], [0.11, 0.11, 0.18], [Math.PI / 2, 0, 0]));
    g.add(mesh(GEO.sph, T('#f7f2ea'), [0.06, 0.22, 0], 0.04));
    g.rotation.z = -0.35;
  } else {
    g.add(mesh(GEO.cyl, T('#3a2a4a'), [0, 0, 0], [0.2, 0.012, 0.2]));
    g.add(mesh(GEO.cone, T('#3a2a4a'), [0, 0.13, 0], [0.1, 0.26, 0.1]));
    g.add(mesh(GEO.torus, T('#f2a03a'), [0, 0.03, 0], [0.095, 0.095, 0.1], [Math.PI / 2, 0, 0]));
    g.rotation.z = 0.2;
  }
  g.position.set(0, y, 0); g.scale.setScalar(1.45); R.head.add(g); R.hat = g; // 帽子大小（可調）
}

// ---- 4. 陣容彩蛋：開戰時檢查我的棋子 ----
function eggCombatStart() {
  if (!cv || !cv.B) return;
  if (EGG_STATE.game !== G.seed) { EGG_STATE.game = G.seed; EGG_STATE.shownThisGame = {}; }
  const B = cv.B, mine = B.units.filter(u => u.owner === ME && !u.summon && ANIMALS[u.key]);
  if (!mine.length) return;
  const costs = new Set(mine.map(u => ANIMALS[u.key].cost));
  const show = (id, b1, b2) => { if (EGG_STATE.shownThisGame[id]) return; EGG_STATE.shownThisGame[id] = 1; setTimeout(() => { banner(b1, b2, 'win'); if (typeof confetti === 'function') confetti(); }, 900); eggFound(id); };
  if (mine.length >= 5 && mine.every(u => ANIMALS[u.key].cost === 1)) show('cheap', '平民逆襲！', '全員 1 費也要贏');
  if ([1, 2, 3, 4, 5].every(c => costs.has(c))) show('rainbow', '五彩動物園！', '1～5 費全員到齊');
  const tc = B['traits' + cv.vt] || {};
  for (const t in TRAITS) if (tc[t] && tc[t].tier === TRAITS[t].tiers.length - 1) { show('pure', `純血部落：${TRAITS[t].name}！`, '羈絆湊到最高階'); break; }
}

// ---- 5. 節日：聖誕下雪、萬聖節南瓜燈 ----
function eggHoliday() {
  let q = null; try { q = new URLSearchParams(location.search).get('egg'); } catch (e) {}
  const d = new Date(), m = d.getMonth() + 1, day = d.getDate();
  if (q === 'xmas' || (m === 12 && day >= 20 && day <= 26)) return 'xmas';
  if (q === 'halloween' || (m === 10 && day >= 25)) return 'halloween';
  return null;
}
function eggArenaDeco() {
  const key = S3.arenaKey + '|' + EGG_STATE.holiday;
  if (!S3.arenaKey || EGG_STATE.decoKey === key) return;
  EGG_STATE.decoKey = key;
  if (S3.eggDeco) { S3.scene.remove(S3.eggDeco); disposeObj(S3.eggDeco); S3.eggDeco = null; }
  if (EGG_STATE.holiday !== 'halloween') return;
  const g = new THREE.Group();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + 0.3, x = Math.cos(a) * 4.9, z = -0.5 + Math.sin(a) * 4.8, p = new THREE.Group();
    p.add(mesh(GEO.sph, T('#e8822a'), [0, 0.18, 0], [0.26, 0.2, 0.26]));
    p.add(mesh(GEO.cyl, T('#5a7a3a'), [0, 0.4, 0], [0.03, 0.08, 0.03]));
    for (const s of [-1, 1]) p.add(mesh(GEO.cone, MB(0xffe27a), [s * 0.08, 0.22, 0.24], [0.04, 0.05, 0.01], [Math.PI / 2, 0, 0]));
    p.add(mesh(GEO.box, MB(0xffe27a), [0, 0.12, 0.25], [0.13, 0.025, 0.01]));
    p.position.set(x, -0.3, z); p.rotation.y = Math.atan2(-x, -(z + 0.5)); g.add(p);
  }
  S3.scene.add(g); S3.eggDeco = g;
}

// ---- 掛到遊戲裡 ----
function eggsBoot() {
  EGG_STATE.holiday = eggHoliday();
  window.addEventListener('keydown', eggKey);
  // 手機：大廳按住標題 2 秒
  const h1 = document.querySelector('#lobby h1');
  if (h1) { let tm = null; h1.addEventListener('pointerdown', () => { tm = setTimeout(toggleParty, 2000); }); for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) h1.addEventListener(ev, () => clearTimeout(tm)); h1.style.userSelect = 'none'; h1.style.webkitUserSelect = 'none'; }
  if (EGG_STATE.holiday) setTimeout(() => { eggFound(EGG_STATE.holiday); }, 1500);
}
function eggsFrame(dt) {
  const kind = eggHatKind();
  if (kind) for (const k in S3.V) { const R = S3.V[k].R; if (R.hatKind !== kind && !R.crown) eggHat(R); }
  if (AVATARS) for (const a of AVATARS) if (a.R.hatKind !== kind) eggHat(a.R);
  eggArenaDeco();
  if (EGG_STATE.holiday === 'xmas' && G && !$('game').hidden) { // 下雪
    EGG_STATE.snowAcc += dt * 14 * (S3.quality || 1);
    while (EGG_STATE.snowAcc > 1) { EGG_STATE.snowAcc--; sprite('puff', V3((Math.random() - .5) * 10, 4 + Math.random() * 2, -0.5 + (Math.random() - .5) * 9), { scale: 0.09, scale1: 0.07, life: 3.5, vel: V3((Math.random() - .5) * 0.3, -1.4, 0), g: 0, color: 0xffffff, opacity: 0.9 }); }
  }
}

// 先讓瀏覽器把大廳畫出來，再做比較重的初始化（3D 場景、頭像），避免開啟時黑屏
let booted = false;
const goBoot = () => { if (booted) return; booted = true; performance.mark('boot-start'); LD.set(35, '準備場地'); try { boot(); } catch (e) { console.error(e); splashFinish(); } performance.mark('boot-end'); };
requestAnimationFrame(() => setTimeout(goBoot, 0));
setTimeout(goBoot, 400); // 背景分頁不會跑 requestAnimationFrame，用計時器保底

})();
</script>
