<title>動物戰棋</title>

<style>
/* 版面：上方 3D 戰場（含 HUD、羈絆欄），下方操作區（等級金幣、裝備、5 格商店、隊友與準備） */
:root {
  --wall: #e3a368; --paper: #f7e9cf; --paper-2: #efdcb8; --ink: #3a2620; --ink-soft: #7a5a48;

  --c1: #9a8a7a; --c2: #4f8a45; --c3: #3d7fc4; --c4: #8a4fc4;
  --bronze: #b87a4c; --silver: #aab4c0; --goldt: #f2c14e;
  --dock: #3b2a24; --dock-2: #4a362e;
  --f-display: "Huninn", "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Zen Maru Gothic", "Huninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
html { background: var(--dock); }
[hidden] { display: none !important; }
body { background: var(--dock); color: var(--ink); font-family: var(--f-body); font-size: 14px; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--gold-2); outline-offset: 2px; }
#app { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* ---------- 大廳 ---------- */
#lobby { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(120% 80% at 50% 30%, #f0b97c, #d98a52 60%, #a85a34); }
#lobby h1 { font-family: var(--f-display); font-size: clamp(44px, 12vw, 64px); margin: 0; color: var(--paper); letter-spacing: .06em; text-shadow: 0 4px 0 rgba(120,50,25,.5); }
#lobby .sub { color: #fff3dc; margin: 0; font-size: 15px; max-width: 30ch; line-height: 1.6; }
.parade { display: flex; justify-content: center; align-items: flex-end; min-height: 120px; }
.parade img { width: 92px; height: 92px; margin: 0 -10px; animation: bob 2.4s ease-in-out infinite; }

.lobby-btns { display: grid; gap: 10px; width: min(320px, 100%); }
.btn { background: var(--paper); border-radius: 12px; padding: 10px 14px; font-weight: 900; box-shadow: 0 3px 0 rgba(60,25,10,.45); color: var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(60,25,10,.45); }

.btn.install { background: linear-gradient(135deg,#c8902a,#ffe08a,#c8902a); color: #3a2010; }
.dex ol { margin: 0 0 8px; padding-left: 22px; line-height: 1.9; }

/* ---------- 戰場 ---------- */

.skydeco { position: absolute; inset: 0; pointer-events: none; }
#stage[data-arena="desert"] .sun { position: absolute; width: 90px; height: 90px; right: 14%; top: 13%; border-radius: 50%; background: radial-gradient(circle, #fff6d8 0 40%, #ffd98a 60%, rgba(255,200,120,0) 72%); opacity: calc(1 - var(--night, 0)); }

.nightsky::after { content: ""; position: absolute; width: 44px; height: 44px; right: 16%; top: 9%; border-radius: 50%; box-shadow: -10px 6px 0 0 #fff4c8; }

.frow { display: flex; align-items: center; gap: 8px; background: #fff8ec; border-radius: 10px; padding: 6px 10px; margin: 6px 0; flex-wrap: wrap; } .frow small { color: var(--ink-soft); font-size: 11px; flex: 1; min-width: 120px; } .frow .btn { padding: 3px 10px; font-size: 12px; }
.frow i.on { width: 8px; height: 8px; border-radius: 50%; background: #bbb; } .frow i.on.y { background: #5fbf4a; }
#btnFriends { position: relative; } .fdot { position: absolute; right: 8px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: #ff5a3c; }
.sflash { position: absolute; inset: 0; z-index: 5; pointer-events: none; mix-blend-mode: screen; opacity: 0; animation: sflash .45s ease-out; } @keyframes sflash { 15% { opacity: .55; } to { opacity: 0; } } /* 五費大招全畫面閃光 */ /* 上方血條／倒數永遠在棋子血條上面，不會被蓋住 */
#stage.ot::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 60px 10px rgba(220,40,20,.55); animation: otp .8s ease-in-out infinite alternate; }
@keyframes otp { from { opacity: .4; } to { opacity: 1; } }

/* 頭頂血條（TFT 風：分段刻度、白色延遲條、藍色能量） */
.hb { position: absolute; left: 0; top: 0; width: 40px; margin-left: -20px; margin-top: -19px; will-change: transform; }
.hb-st { height: 9px; font-size: 9px; line-height: 9px; text-align: center; letter-spacing: -1px; color: var(--gold-2); text-shadow: 0 1px 0 #3a2620, 0 0 3px #3a2620; font-weight: 900; }

.hb-bar i { position: absolute; left: 0; top: 0; bottom: 0; }
.hb-lag { background: #fff3e0; }
.hb-hp { background: linear-gradient(#9be07a, #5fae4a); }
.hb.enemy .hb-hp { background: linear-gradient(#ff8a6a, #d9483a); }
.hb-sh { background: rgba(255,255,255,.85); left: auto !important; right: 0; }
.hb-tk { position: absolute; inset: 0; background-image: linear-gradient(90deg, transparent calc(100% - 1px), rgba(30,15,10,.75) 0); background-size: 25% 100%; }
.hb-mp { position: relative; height: 4px; margin-top: 1px; background: #1d2030; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px rgba(20,20,40,.8); }
.hb-mp i { display: block; height: 100%; width: 0; background: linear-gradient(#9fdcff, #3a8fe0); transition: width .12s linear; }
.hb-mp.nomp { visibility: hidden; }
.hb-mp.full i { background: linear-gradient(#ffffff, #8fd0ff); animation: mpfull .5s ease-in-out infinite alternate; }
@keyframes mpfull { to { filter: brightness(1.5); box-shadow: 0 0 6px #bfe6ff; } }
.hb-mp.cast::after { content: ""; position: absolute; inset: 0; background: #fff; animation: mpcast .35s ease-out forwards; }

.btn small { font-size: 10px; opacity: .75; margin-left: 3px; font-weight: 700; }
.num { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-display); font-weight: 900; font-size: 16px; color: #fff3e0; -webkit-text-stroke: 3px rgba(40,20,12,.85); paint-order: stroke fill; animation: num .9s ease-out forwards; white-space: nowrap; }
.num.magic { color: #c9b6ff; } .num.true { color: #ffffff; } .num.crit { color: #ffcf3a; font-size: 22px; } .num.heal { color: #9be07a; } .num.miss { color: #d8cfc6; font-size: 13px; } .num.cc { color: #ffb36b; font-size: 13px; } .num.skill { color: #fff6c8; font-size: 15px; -webkit-text-stroke: 3px #7a2e1e; }

/* HUD */
.hud { position: absolute; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: start; padding: 8px max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); pointer-events: none; }

.team.r .hp i { background: var(--enemy); margin-left: auto; }

#itemTip { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; background: rgba(43,28,22,.95); color: var(--paper); border-radius: 10px; padding: 6px 10px; font-size: 12px; max-width: 220px; display: grid; gap: 2px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
#itemTip b { color: #ffd34d; } #itemTip small { font-size: 11px; opacity: .85; }
.sellzone b { color: #ffd34d; } .sellzone .szit { margin-left: 8px; display: inline-flex; gap: 3px; align-items: center; font-size: 12px; } .sellzone .szit svg { width: 16px; height: 16px; }
.emobtn { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); bottom: 52px; z-index: 6; width: 34px; height: 34px; border-radius: 50%; background: rgba(43,28,22,.72); font-size: 18px; display: grid; place-items: center; pointer-events: auto; }
.emopick { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); bottom: 92px; z-index: 8; display: grid; grid-template-columns: repeat(4, 38px); gap: 4px; padding: 6px; border-radius: 12px; background: rgba(43,28,22,.9); pointer-events: auto; }
.emopick button { font-size: 22px; height: 38px; border-radius: 8px; background: rgba(255,255,255,.08); }
#emoBubbles { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); z-index: 6; display: grid; gap: 4px; justify-items: center; pointer-events: none; }
.emob { display: flex; align-items: center; gap: 6px; background: rgba(255,248,230,.95); color: var(--ink); border-radius: 999px; padding: 2px 10px 2px 4px; font-size: 12px; font-weight: 800; animation: emoin .25s ease-out, emoout .4s ease-in 2.8s forwards; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.emob i { font-style: normal; font-size: 22px; } .emob.me { background: #dff0ff; } .emob.mate { background: #e8f8dc; }
@keyframes emoin { from { transform: scale(.4); opacity: 0; } } @keyframes emoout { to { transform: translateY(-10px); opacity: 0; } }
.hpchart { width: 100%; height: auto; background: #fff8ec; border-radius: 10px; }
.hplegend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; margin-top: 6px; } .hplegend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.sheet .rec { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; } .sheet .rec span { display: inline-flex; align-items: center; gap: 3px; background: #f1e4cc; border-radius: 999px; padding: 1px 8px 1px 3px; } .sheet .rec svg { width: 16px; height: 16px; }
.mvp { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 8px auto; padding: 8px 12px; border-radius: 12px; background: linear-gradient(135deg, #fff2c8, #ffe08a); color: var(--ink); max-width: 300px; text-align: left; }
.mvp img { width: 56px; height: 56px; } .mvp small { display: block; font-size: 11px; color: #a86a10; font-weight: 900; } .mvp b { display: block; font-size: 18px; font-family: var(--f-display); } .mvp span { font-size: 12px; }
.team.stand .srow { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 14px 10px minmax(0,1fr) auto auto auto; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 7px; font-size: 11px; line-height: 14px; cursor: pointer; opacity: .92; min-width: 0; }

.team.stand .sstk.win { background: #ff7a1a; color: #fff; } .team.stand .sstk.lose { background: #5a7fb0; color: #fff; }
.team.stand .svs svg { width: 14px; height: 14px; display: block; }
.team.stand .srow.opp { box-shadow: inset 0 0 0 1px rgba(255,138,106,.7); }
.team.stand .srow.cand { box-shadow: inset 0 0 0 1px rgba(255,211,77,.55); } .team.stand .scand { font-size: 10px; font-weight: 900; width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; background: #f2c14e; color: #5a3010; }
.nopp { background: #fff8ec; border-radius: 12px; padding: 8px 10px; margin: 8px 0; } .nopp .nh { display: flex; align-items: center; gap: 6px; } .nopp .nh small { color: var(--ink-soft); } .nopp .nh .btn { margin-left: auto; padding: 4px 10px; font-size: 12px; }
.nopp .nu { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; } .nopp .nu span { position: relative; width: 40px; height: 40px; border-radius: 8px; background: #efe2cc; box-shadow: inset 0 0 0 2px var(--cc); overflow: hidden; } .nopp .nu img { width: 100%; height: 100%; }

/* Q 版雙刀互敲 */
.clash { display: block; overflow: visible; }
.clash.sm { width: 26px; height: 18px; }

@keyframes swL { 0%, 100% { transform: rotate(18deg); } 42% { transform: rotate(10deg); } 55% { transform: rotate(40deg); } 66% { transform: rotate(32deg); } }
